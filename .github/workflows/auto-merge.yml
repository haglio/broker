name: auto-arm auto-merge

# A green PR should never sit waiting for someone to click "merge when ready".
# This enables auto-merge on every non-draft PR the moment it opens, so the merge
# queue picks it up automatically once the required check passes on the candidate.
# Drafts are exempt (mark a PR draft to hold it). Requires "Allow auto-merge" on
# in repo Settings.
#
# It arms auto-merge with a GitHub App token, NOT the built-in GITHUB_TOKEN:
# GitHub blocks actions taken by GITHUB_TOKEN from triggering further workflows, so
# a queue entry it creates never fires the merge_group required check and the PR
# stalls forever. The App is a separate identity, so its enqueue does trigger that
# check and the PR merges hands-off. Needs the org secrets AUTOMERGE_APP_ID /
# AUTOMERGE_APP_KEY (the haglio-PR-auto-merger App, installed on the org).

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions: {}

jobs:
  arm:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint a token from the auto-merge App
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_KEY }}
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --auto \
            || echo "::warning::Could not enable auto-merge — is 'Allow auto-merge' on and the App installed?"
