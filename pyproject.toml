[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osr2-broker"
version = "0.1.0"
requires-python = ">=3.10"
# The shared siblings are NOT listed here — ../app_support (logging, threading
# and CLI scaffolding) and ../shared_ui (the family's design tokens, which the
# tray and the idle-warning dialog paint themselves with). Each is installed
# editable from a local path and neither is published, so pip would go looking
# for them on PyPI.
dependencies = [
    "pyserial",
    "PyQt6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
    "vulture",
]

[tool.pytest.ini_options]
# The timeout is a ceiling, not a target: the slowest test here is the
# tracked-tree content scan at ~2.4 s, so 60 s clears it twenty times over and
# can only bite on a hang -- which this repo has already produced, when a red
# session test left three spinning daemon threads and the file had to be killed
# at 120 s with no summary naming it. The thread method prints the hung stack.
# tests/test_timeouts.py holds both halves of it.
addopts = "-p no:cacheprovider --timeout=60 --timeout-method=thread"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["osr2_broker*"]
namespaces = false
