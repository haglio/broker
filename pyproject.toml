[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osr2-broker"
version = "0.1.0"
# 3.12, not 3.10: every gate in the family runs 3.12 and nothing has ever
# collected a suite on anything older, so >=3.10 was a promise no run backed.
requires-python = ">=3.12"
# The shared siblings are in [tool.haglio] below, not here: neither is published,
# so pip would go looking for them on PyPI.
#
# Every requirement carries a ceiling. Without one each run installs whatever
# PyPI served that morning, which is how this family's gates came to run a major
# version of the imaging stack past the one the machines have. Floors are what
# this repo's venv holds today.
# The family repos this one runs are named at the tags it was built against
# rather than left to be whatever checkouts sit beside it. Unpinned, a change
# landing in one of them reached every consumer the same minute, and one whose
# other half had not landed turned all of them red at once. Moving to a newer
# one is this repo's own commit, with its own suite to answer for it.
dependencies = [
    "app-support @ git+https://github.com/haglio/app_support@v0.1.140",
    "shared-ui @ git+https://github.com/haglio/shared_ui@v0.1.123",
    "pyserial>=3,<4",
    "PyQt6>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-timeout>=2.4,<3",
    "vulture>=2.16,<3",
    "ruff==0.16.6",
]

[tool.pytest.ini_options]
# A ceiling on a hang, not a performance budget. The slowest test on a
# developer machine is the tracked-tree content scan, but it is not the
# slowest on a runner: it returns early when no blocklist is reachable, and
# the blocklist is git-ignored, so a fresh checkout has none. What CI does run
# longest here is the session teardown-retry test at about a second.
# --timeout-method=thread is the half that pays for itself: it dumps the stack
# of the test that stopped, which turns a stalled required check into a
# one-line diagnosis.
# tests/test_timeouts.py holds all three halves of it.
addopts = "-p no:cacheprovider --timeout=60 --timeout-method=thread -p app_support.sanitize.pytest_plugin"
testpaths = ["tests"]

# The family checkouts this one is installed beside: app_support (logging,
# threading and CLI scaffolding) and shared_ui (the design tokens the tray and
# the idle-warning dialog paint themselves with). Neither is published, so
# neither can go in [project.dependencies]; a comment was the record until it
# decayed across the family, so this is the record, and
# tests/test_dependencies.py holds it against the tree.
[tool.haglio]
siblings = ["app_support", "shared_ui"]

# What launch_broker_tray.vbs starts: the file the "OSR2 Broker" scheduled task,
# the Start Menu shortcut and Fun Time all run. The launcher is rendered from
# this by `python -m app_support.launcher --write`.
[tool.haglio.launchers."launch_broker_tray.vbs"]
app = "OSR2 Broker"
interpreter = "pythonw.exe"
named-interpreter = "Broker-Tray.exe"
run = '-m osr2_broker.tray --config "{root}\osr2_broker_config.json"'

[tool.setuptools.packages.find]
include = ["osr2_broker*"]
namespaces = false
