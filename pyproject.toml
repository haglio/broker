[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osr2-broker"
version = "0.1.0"
requires-python = ">=3.10"
# The shared siblings are NOT listed here — ../app_support (logging, threading
# and CLI scaffolding) and ../shared_ui (the family's design tokens, which the
# tray and the idle-warning dialog paint themselves with). Each is installed
# editable from a local path and neither is published, so pip would go looking
# for them on PyPI.
dependencies = [
    "pyserial",
    "PyQt6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
    "vulture",
    "ruff==0.16.6",
]

[tool.pytest.ini_options]
# A ceiling on a hang, not a performance budget. The slowest test on a
# developer machine is the tracked-tree content scan, but it is not the
# slowest on a runner: it returns early when no blocklist is reachable, and
# the blocklist is git-ignored, so a fresh checkout has none. What CI does run
# longest here is the session teardown-retry test at about a second.
# --timeout-method=thread is the half that pays for itself: it dumps the hung
# stack, which turns a stalled required check into a one-line diagnosis.
# tests/test_timeouts.py holds all three halves of it.
addopts = "-p no:cacheprovider --timeout=60 --timeout-method=thread -p app_support.sanitize.pytest_plugin"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["osr2_broker*"]
namespaces = false
