[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osr2-broker"
version = "0.1.0"
# The version every gate runs, and the one the family's machine runs: a floor
# lower than what a run proves is a promise nothing backs.
requires-python = ">=3.14"
# The shared siblings are in [tool.haglio] below, not here: neither is published,
# so pip would go looking for them on PyPI.
#
# Every requirement carries a ceiling. Without one each run installs whatever
# PyPI served that morning, which is how this family's gates came to run a major
# version of the imaging stack past the one the machines have. Floors are what
# this repo's venv holds today.
# The family repos this one runs are named at the tags it was built against
# rather than left to be whatever checkouts sit beside it. Unpinned, a change
# landing in one of them reached every consumer the same minute, and one whose
# other half had not landed turned all of them red at once. Moving to a newer
# one is this repo's own commit, with its own suite to answer for it.
dependencies = [
    "app-support @ git+https://github.com/haglio/app_support@v0.1.334",
    "shared-ui @ git+https://github.com/haglio/shared_ui@v0.1.292",
    "pyserial>=3,<4",
    "PyQt6>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pytest-timeout>=2.4,<3",
    "vulture>=2.16,<3",
    "ruff==0.16.6",
]

[tool.pytest.ini_options]
# A ceiling on a hang, not a performance budget. The slowest test on a
# developer machine is the tracked-tree content scan, but it is not the
# slowest on a runner: it returns early when no blocklist is reachable, and
# the blocklist is git-ignored, so a fresh checkout has none. What CI does run
# longest here is the session teardown-retry test at about a second.
# --timeout-method=thread is the half that pays for itself: it dumps the stack
# of the test that stopped, which turns a stalled required check into a
# one-line diagnosis.
# app_support.gates holds all three halves of it.
addopts = "-p no:cacheprovider --timeout=60 --timeout-method=thread -p app_support.sanitize.pytest_plugin -p app_support.gates.pytest_plugin -p app_support.coverage_gate --cov --cov-report="
testpaths = ["tests"]

# The family checkouts this one is installed beside: app_support (logging,
# threading and CLI scaffolding) and shared_ui (the design tokens the tray and
# the idle-warning dialog paint themselves with). Neither is published, so
# neither can go in [project.dependencies]; a comment was the record until it
# decayed across the family, so this is the record, and
# the family's dependency gate holds it against the tree.
[tool.haglio]
siblings = ["app_support", "shared_ui"]

# What the family's gates (app_support.gates) let stand here, each for the
# reason beside it. An entry nothing is reported for any more fails the gate.
[tool.haglio.dead-code]
# --config is read off argv by app_support.cli.preparse_config_path, before the
# parser runs; the declaration is there for --help.
unread-command-line-options = ["config"]

# Declared, so that every launcher here brings this checkout up to what has
# shipped, and waits out an update of it already under way, before it starts
# the broker's tray (app_support.production_update).
[tool.haglio.production]

# What launch_broker_tray.vbs starts: the file the scheduled task and Fun Time
# run. The launchers are rendered from these by
# `python -m app_support.launcher --write`.
[tool.haglio.launchers."launch_broker_tray.vbs"]
app = "Broker"
interpreter = "pythonw.exe"
named-interpreter = "Broker-Tray.exe"
run = '-m osr2_broker.tray --config "{root}\osr2_broker_config.json"'

# What the pinned shortcut runs: the same tray, with the family's loading screen
# up from the click. The scheduled task's starts, which nobody clicked, show none.
[tool.haglio.launchers."launch_broker_from_its_shortcut.vbs"]
app = "Broker"
interpreter = "pythonw.exe"
named-interpreter = "Broker-Tray.exe"
run = '-m osr2_broker.tray --config "{root}\osr2_broker_config.json"'
log = 'state\broker_launcher.log'
loading-screen = ["Updating Broker..."]

[tool.haglio.launchers."launch_preview_branch.vbs"]
app = "Broker (branch preview)"
interpreter = "pythonw.exe"
venv = "primary"
run = '-m osr2_broker.tray --config "{primary}\osr2_broker_config.json"'
log = 'state\preview_branch.log'
loading-screen = ["Updating Broker..."]
preview = true
environment = { BROKER_BRANCH_SESSION = "1" }

# What the broker relies on Windows to keep: the shortcut it is pinned from, and
# the scheduled task that starts the tray at sign-in and again within two minutes
# of it dying. `python -m app_support.windows_settings --write` makes this machine
# match every checkout's list.
[tool.haglio.shortcuts."Broker"]
launcher = "launch_broker_from_its_shortcut.vbs"
icon = "broker_icon.ico"
app-id = "OSR2Broker"
places = ["taskbar", "checkout"]

[tool.haglio.scheduled-tasks."Broker"]
launcher = "launch_broker_tray.vbs"
every-minutes = 2

[tool.setuptools.packages.find]
include = ["osr2_broker*"]
namespaces = false
