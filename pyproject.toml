[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osr2-broker"
version = "0.1.0"
requires-python = ">=3.10"
# The shared siblings are NOT listed here — ../app_support (logging, threading
# and CLI scaffolding) and ../shared_ui (the family's design tokens, which the
# tray and the idle-warning dialog paint themselves with). Each is installed
# editable from a local path and neither is published, so pip would go looking
# for them on PyPI.
dependencies = [
    "pyserial",
    "PyQt6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "vulture",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["osr2_broker*"]
namespaces = false
